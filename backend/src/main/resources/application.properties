spring.application.name=aims-backend

# Server Port
server.port=${PORT:8088}

# Database Configuration (Persistent SQL Database with MySQL mode)
spring.datasource.url=jdbc:h2:file:./data/asset_management_db;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.open-in-view=false

# JWT Secret Configuration
aims.app.jwtSecret=SuperSecretKeyForAssetIssueAndReturnManagementSystemBackend1234567890
aims.app.jwtExpirationMs=86400000

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.niyati.template=DEBUG
logging.file.name=logs/aims-backend.log

# Swagger/OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
